<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12645c">
  <title>Shopping Cart — NEXORA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 36px;
      margin: 40px 0 60px;
      align-items: flex-start;
    }
    .cart-items-table {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .cart-item-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px 120px 40px;
      gap: 16px;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }
    .cart-item-row:last-child { border-bottom: none; }
    .cart-item-thumb {
      width: 80px;
      height: 80px;
      background: var(--surface-alt);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .cart-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cart-summary-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: sticky;
      top: 90px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .summary-total {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }
    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; }
      .cart-item-row {
        grid-template-columns: 60px 1fr;
        gap: 12px;
      }
      .cart-summary-card { position: static; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <button class="header-back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('/index.html')" title="Go back" aria-label="Go back">
          ← Back
        </button>

        <a class="brand" href="/index.html" title="NEXORA Home">
          <span class="brand-mark">N</span>
          <span>NEXORA</span>
        </a>
        <div class="header-actions">
          <a href="/pages/wishlist.html" class="action-btn" title="Saved Wishlist"><span aria-hidden="true">🤍</span> Wishlist</a>
          <div id="header-auth-nav" style="display:flex;align-items:center;gap:8px;">
            <a href="/pages/login.html" class="action-btn">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size:28px;margin:32px 0 16px;">Shopping Cart</h1>

    <div id="cart-content">
      <div class="state-box"><p>Loading your shopping cart…</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <div>© 2026 NEXORA Inc. All rights reserved.</div>
        <div><a href="/pages/products.html">Continue Shopping →</a></div>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/cart-page.js"></script>
</body>
</html>
