<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12645c">
  <title>All Products — NEXORA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .catalog-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 32px;
      margin: 36px 0 60px;
      align-items: flex-start;
    }
    .filters-sidebar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: sticky;
      top: 90px;
    }
    .filter-group {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .filter-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }
    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--ink-secondary);
    }
    .filter-option:hover { color: var(--ink); }
    .catalog-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .catalog-count {
      font-size: 14px;
      color: var(--ink-secondary);
    }
    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .sort-select {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-family: inherit;
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 40px;
    }
    @media (max-width: 860px) {
      .catalog-layout {
        grid-template-columns: 1fr;
      }
      .filters-sidebar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="container">
      <div>Fast, reliable delivery across India · Authentic Verified Electronics</div>
      <div><a href="/pages/orders.html">Track Order</a></div>
    </div>
  </div>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <button class="header-back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('/index.html')" title="Go back to previous page" aria-label="Go back">
          ← Back
        </button>

        <a class="brand" href="/index.html" title="NEXORA Home">
          <span class="brand-mark">N</span>
          <span>NEXORA</span>
        </a>

        <div class="header-search">
          <form class="search-form" id="search-form">
            <input type="text" id="search-input" name="q" placeholder="Search product catalogue..." aria-label="Search products">
            <button type="submit" aria-label="Submit search">🔍</button>
          </form>
        </div>

        <div class="header-actions">
          <a href="/pages/wishlist.html" class="action-btn" title="Saved Wishlist">
            <span aria-hidden="true">🤍</span>
            <span class="action-label">Wishlist</span>
          </a>
          <a href="/pages/cart.html" class="action-btn" title="Shopping Cart">
            <span aria-hidden="true">🛒</span>
            <span class="action-label">Cart</span>
            <span id="header-cart-badge" class="badge-count" hidden>0</span>
          </a>
          <div id="header-auth-nav" style="display:flex;align-items:center;gap:8px;">
            <a href="/pages/login.html" class="action-btn">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="catalog-layout">
      <!-- Sidebar Filters -->
      <aside class="filters-sidebar">
        <div class="filter-group">
          <h3 class="filter-title">Category</h3>
          <div class="filter-options" id="category-filter-list">
            <label class="filter-option">
              <input type="radio" name="category" value="" checked>
              <span>All Categories</span>
            </label>
          </div>
        </div>

        <div class="filter-group">
          <h3 class="filter-title">Price Range (₹)</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
            <input type="number" id="min-price-input" placeholder="Min ₹" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:100%;font-size:13px;">
            <input type="number" id="max-price-input" placeholder="Max ₹" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:100%;font-size:13px;">
          </div>
          <button id="apply-price-btn" class="btn btn-secondary btn-sm btn-block">Filter Price</button>
        </div>

        <button id="reset-filters-btn" class="btn btn-outline btn-sm btn-block">Reset All Filters</button>
      </aside>

      <!-- Products Content Area -->
      <section>
        <div class="catalog-toolbar">
          <div class="catalog-count" id="catalog-count">Loading products…</div>
          <div class="sort-control">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="newest">Newest Arrivals</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="oldest">Oldest</option>
            </select>
          </div>
        </div>

        <div class="catalog-grid" id="catalog-grid">
          <!-- Rendered by products-page.js -->
        </div>

        <div class="pagination" id="pagination">
          <!-- Pagination buttons -->
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <div>© 2026 NEXORA Inc. All rights reserved. Real database products.</div>
        <div><a href="/index.html">← Back to Homepage</a></div>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/products-page.js"></script>
</body>
</html>
