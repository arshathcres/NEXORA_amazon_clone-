<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12645c">
  <title>Order History & Tracking — NEXORA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .order-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }
    .order-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .order-status-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-PENDING { background: #fef3c7; color: #92400e; }
    .status-PROCESSING { background: #e0f2fe; color: #075985; }
    .status-SHIPPED { background: #ede9fe; color: #5b21b6; }
    .status-DELIVERED { background: #dcfce7; color: #166534; }
    .status-CANCELLED { background: #fee2e2; color: #991b1b; }
    .order-item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <button class="header-back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('/index.html')" title="Go back" aria-label="Go back">
          ← Back
        </button>
        <a class="brand" href="/index.html" title="NEXORA Home"><span class="brand-mark">N</span><span>NEXORA</span></a>
        <div class="header-actions">
          <a href="/pages/profile.html" class="action-btn">Profile</a>
          <a href="/pages/cart.html" class="action-btn">Cart</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin: 36px auto 60px; max-width: 860px;">
    <h1 style="font-size:26px;margin-bottom:20px;">Your Orders & Tracking</h1>
    <div id="orders-container">
      <div class="state-box"><p>Loading your orders…</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <div>© 2026 NEXORA Inc. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/orders-page.js"></script>
</body>
</html>
