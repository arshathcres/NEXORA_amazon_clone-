<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12645c">
  <title>Delivery Addresses — NEXORA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .addresses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 28px 0 40px;
    }
    .address-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .address-card.is-default {
      border-color: var(--accent);
      background: #fafdfc;
    }
    .default-chip {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }
    .address-form-modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 560px;
      margin: 20px auto 40px;
      box-shadow: var(--shadow-md);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <button class="header-back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('/index.html')" title="Go back" aria-label="Go back">
          ← Back
        </button>
        <a class="brand" href="/index.html" title="NEXORA Home"><span class="brand-mark">N</span><span>NEXORA</span></a>
        <div class="header-actions">
          <a href="/pages/profile.html" class="action-btn">Profile</a>
          <a href="/pages/cart.html" class="action-btn">Cart</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px;">
      <h1 style="font-size:26px;">Delivery Addresses</h1>
      <button id="show-add-form-btn" class="btn btn-primary btn-sm">+ Add New Address</button>
    </div>

    <!-- Add Address Form -->
    <div id="address-form-wrap" style="display:none;">
      <div class="address-form-modal">
        <h3 style="font-size:18px;margin-bottom:16px;">Add Delivery Address</h3>
        <form id="new-address-form">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="full_name" required placeholder="Asha Kumar">
            </div>
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" name="phone" required placeholder="9876543210">
            </div>
          </div>
          <div class="form-group">
            <label>Street Address / Flat / Building</label>
            <input type="text" name="address_line1" required placeholder="Flat 402, Green Valley Apartments">
          </div>
          <div class="form-group">
            <label>Landmark / Area (Optional)</label>
            <input type="text" name="address_line2" placeholder="Near City Mall">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" name="city" required placeholder="Chennai">
            </div>
            <div class="form-group">
              <label>State</label>
              <input type="text" name="state" required placeholder="Tamil Nadu">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>PIN Code</label>
              <input type="text" name="postal_code" required placeholder="600001">
            </div>
            <div class="form-group">
              <label>Country</label>
              <input type="text" name="country" value="India" required>
            </div>
          </div>
          <div style="margin-bottom:18px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
              <input type="checkbox" name="is_default">
              <span>Set as default delivery address</span>
            </label>
          </div>
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Save Address</button>
            <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Address Cards -->
    <div class="addresses-grid" id="addresses-grid">
      <div class="state-box" style="grid-column: 1 / -1;"><p>Loading your addresses…</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <div>© 2026 NEXORA Inc. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/addresses-page.js"></script>
</body>
</html>
